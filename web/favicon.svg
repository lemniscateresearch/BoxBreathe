<!-- The browser tab icon. It is assets/icon/icon.svg with rounded corners,
     a thicker path and a larger dot, so that it stays clear at 16 px.
     favicon.png is the fallback for browsers without SVG favicons. -->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <rect width="108" height="108" rx="24" fill="#163C34"/>
  <g transform="translate(54 54) scale(1.3) translate(-54 -54)">
    <rect x="32" y="32" width="44" height="44" rx="9" fill="none" stroke="#A8D5C4" stroke-width="7"/>
    <circle cx="32" cy="42" r="9" fill="#F4E7D0"/>
  </g>
</svg>
