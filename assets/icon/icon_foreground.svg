<!-- The Android adaptive icon foreground. The background is #163C34.
     Launchers show the middle 72 dp of this 108 dp canvas. At 80% scale the
     glyph fills the same part of that area as it does in icon.svg, and it
     stays inside the 66 dp safe zone, so no launcher mask cuts it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 108 108">
  <g transform="translate(54 54) scale(0.8) translate(-54 -54)">
    <rect x="32" y="32" width="44" height="44" rx="9" fill="none" stroke="#A8D5C4" stroke-width="5"/>
    <circle cx="32" cy="42" r="7" fill="#F4E7D0"/>
  </g>
</svg>
